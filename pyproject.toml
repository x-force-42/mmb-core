[tool.pytest.ini_options]
testpaths = ["tests/unit", "tests/integration"]
python_files = "test_*.py"
addopts = "-ra --strict-markers"
pythonpath = ["."]
asyncio_mode = "auto"
markers = [
    "e2e: end-to-end real-CLI smoke (rodar via scripts/e2e.sh)",
]

[tool.coverage.run]
source = ["."]
omit = [
    "tests/*",
    ".venv/*",
    "bot.py",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.:",
    "raise NotImplementedError",
]
show_missing = true
skip_covered = false
